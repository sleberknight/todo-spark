name: build
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**/*.md'
  # Push and pull request builds use the released spark-core pinned in pom.xml. The
  # scheduled run (which happens even without a todo-spark commit) and manual runs are
  # a canary: they build against the latest dsingley/spark (ossrh) SNAPSHOT instead,
  # which catches breakage from fork changes before it's noticed some other way.
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out todo-spark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Canary builds (scheduled and manual runs) use the in-progress spark-core on
      # dsingley/spark's ossrh branch rather than the released version in pom.xml, so it
      # has to be built and installed locally first.
      - name: Check out dsingley/spark (canary build only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dsingley/spark
          ref: ossrh
          path: spark-core-dependency

      - name: Install spark-core SNAPSHOT (canary build only)
        id: spark-core
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: spark-core-dependency
        run: |
          mvn -B -V install -DskipTests
          echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # TodoBrowserTest needs the Playwright browser binaries, which aren't a Maven
      # dependency and aren't cheap to download - cache them by the same pom.xml hash
      # used for the Maven cache, so a playwright.version bump invalidates it too.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}

      - name: Install Playwright browsers
        run: |
          mvn -B -V test-compile
          mvn -q dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=/tmp/cp.txt
          java -cp "$(cat /tmp/cp.txt):target/test-classes:target/classes" com.microsoft.playwright.CLI install --with-deps chromium

      - name: Build and test todo-spark
        # Playwright's host-dependency check validates libraries for every browser
        # engine it knows about, not just the one actually installed/used here - it
        # always flags WebKit/GStreamer libs even though only Chromium is ever
        # launched, so skip that check rather than chase permanently-missing libs.
        env:
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: '1'
          # empty unless this is a canary build, in which case it's the installed SNAPSHOT
          SPARK_CORE_CANARY_VERSION: ${{ steps.spark-core.outputs.version }}
        run: |
          if [ -n "$SPARK_CORE_CANARY_VERSION" ]; then
            echo "Canary build against spark-core $SPARK_CORE_CANARY_VERSION"
            mvn -B -V verify "-Dspark-core.version=$SPARK_CORE_CANARY_VERSION"
          else
            mvn -B -V verify
          fi
