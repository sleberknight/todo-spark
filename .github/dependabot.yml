version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # spark-core is deliberately pinned to this fork's unpublished SNAPSHOT, built from
    # source by the CI workflow rather than resolved from any repository - there's never
    # a published version for Dependabot to compare against, so don't bother checking it.
    ignore:
      - dependency-name: "com.dsingley.sparkjava:spark-core"
    groups:
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "sleberknight"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
    assignees:
      - "sleberknight"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
